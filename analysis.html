<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gaze Experiment Analysis</title>
    <link rel="stylesheet" href="viz.css?v=20261023-1" />
    <style>
      body { margin: 0; background: #f9f9f7; color: #0b0b0b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 20px clamp(16px, 4vw, 56px); border-bottom: 1px solid rgba(11,11,11,.1); background: #fff; }
      header h1 { margin: 0; font-size: 18px; } header p { margin: 2px 0 0; color: #52514e; font-size: 13px; }
      .eyebrow { margin: 0; color: #087f73; font-size: 11px; font-weight: 800; letter-spacing: .12em; }
      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
      .actions button, .actions label { padding: 8px 14px; border: 1px solid rgba(11,11,11,.15); border-radius: 4px; background: #fff; font: 600 13px system-ui, sans-serif; cursor: pointer; }
      .actions .primary { border-color: #087f73; color: #fff; background: #087f73; }
      main { padding: 22px clamp(16px, 4vw, 56px) 60px; }
      .drop { display: grid; place-items: center; max-width: 1280px; min-height: 120px; margin: 0 auto 18px; padding: 18px; border: 2px dashed #c3c2b7; border-radius: 10px; color: #52514e; font-size: 14px; text-align: center; background: #fff; }
      .drop.over { border-color: #087f73; background: #eaf7f4; }
      .drop small { display: block; margin-top: 6px; color: #898781; }
      #status { max-width: 1280px; margin: 0 auto 12px; color: #52514e; font-size: 13px; min-height: 18px; }
      a { color: #075c55; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">BN5213 FINAL PROJECT · ANALYSIS</p>
        <h1>Multi-participant summary</h1>
        <p>Load the <code>.json</code> files exported at the end of each session. Everything is processed locally in this tab.</p>
      </div>
      <div class="actions">
        <label class="primary" for="file-input">Load JSON files…</label>
        <input id="file-input" type="file" accept=".json,application/json" multiple hidden />
        <button id="load-demo" type="button">Load synthetic demo data</button>
        <button id="export-csv" type="button">Summary CSV</button>
        <button id="export-png" type="button">All charts as PNG</button>
        <button id="clear" type="button">Clear</button>
      </div>
    </header>
    <main>
      <div id="drop" class="drop"><div>Drop session JSON files here<small>Files with the same participant ID replace the earlier one. <a href="index.html">Back to the experiment</a></small></div></div>
      <p id="status" role="status"></p>
      <div id="dashboard" class="viz-root"></div>
    </main>
    <script src="viz.js?v=20261023-1"></script>
    <script>
      (() => {
        const sessions = new Map();
        const status = (t) => { document.getElementById('status').textContent = t; };
        const dash = document.getElementById('dashboard');
        function render() {
          GazeViz.renderGroupDashboard(dash, [...sessions.values()], { onRemove: (id) => { sessions.delete(id); render(); } });
          status(sessions.size ? `${sessions.size} session(s) loaded.` : '');
        }
        function add(payload, name) {
          if (!payload || !Array.isArray(payload.trials)) throw new Error(`${name}: not an exported session file`);
          sessions.set(payload.participantId || name, payload);
        }
        async function loadFiles(files) {
          const errors = [];
          for (const f of files) { try { add(JSON.parse(await f.text()), f.name); } catch (e) { errors.push(e.message); } }
          render(); if (errors.length) status(`Some files were skipped: ${errors.join('; ')}`);
        }
        document.getElementById('file-input').addEventListener('change', (e) => loadFiles([...e.target.files]));
        const drop = document.getElementById('drop');
        ['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
        ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
        drop.addEventListener('drop', (e) => loadFiles([...e.dataTransfer.files].filter((f) => f.name.endsWith('.json'))));
        document.getElementById('load-demo').addEventListener('click', async () => {
          try {
            const list = await (await fetch('sample_data/index.json', { cache: 'no-store' })).json();
            for (const name of list) add(await (await fetch(`sample_data/${name}`, { cache: 'no-store' })).json(), name);
            render();
          } catch (e) { status('Could not load sample_data/ — open this page through the launcher (http://localhost), not file://.'); }
        });
        document.getElementById('export-csv').addEventListener('click', () => {
          const csv = GazeViz.summaryCsv([...sessions.values()]); if (!csv) return;
          const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'participant-summary.csv'; a.click();
        });
        document.getElementById('export-png').addEventListener('click', async () => {
          for (const b of dash.querySelectorAll('.gv-export')) { b.click(); await new Promise((r) => setTimeout(r, 350)); }
        });
        document.getElementById('clear').addEventListener('click', () => { sessions.clear(); render(); });
        render();
      })();
    </script>
  </body>
</html>
